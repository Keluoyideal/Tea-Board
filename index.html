<title>後場茶湯效期板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one screen, no scrolling — top bar (title, page tabs, clock), pearl reminder, then the active page: tea+pearl board or toppings board. Each card is both the button and the live timer, with today's running total. A thin tally strip with the Records button sits at the bottom; sheets open over the board. */
:root{
  --bg:#ecefe6; --surface:#fafbf6; --sunk:#e2e6da; --ink:#1d271f; --muted:#5f6a5c; --line:#cfd6c4;
  --accent:#2c5a43; --accent-ink:#f4f8f1; --pearl:#6b3f1d; --pearl-bg:#f1e7dc; --top:#7a4f8a;
  --ok:#3b7a4b; --warn:#b8720b; --warn-bg:#fbefd8; --bad:#b0281f; --bad-bg:#f8e1dd; --cook:#3d5f8f; --cook-bg:#e3eaf4;
  --band-edge:transparent;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a16; --surface:#1c241f; --sunk:#111613; --ink:#e4ebdf; --muted:#9aa695; --line:#2f3a32;
  --accent:#7cbf98; --accent-ink:#0f1a13; --pearl:#d9a77c; --pearl-bg:#2a211a; --top:#c9a0d8;
  --ok:#79c08a; --warn:#e8a843; --warn-bg:#3a2c12; --bad:#ff7a6e; --bad-bg:#3d1a17; --cook:#8fb3e6; --cook-bg:#1a2433;
  --band-edge:#5b665d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a16; --surface:#1c241f; --sunk:#111613; --ink:#e4ebdf; --muted:#9aa695; --line:#2f3a32;
  --accent:#7cbf98; --accent-ink:#0f1a13; --pearl:#d9a77c; --pearl-bg:#2a211a; --top:#c9a0d8;
  --ok:#79c08a; --warn:#e8a843; --warn-bg:#3a2c12; --bad:#ff7a6e; --bad-bg:#3d1a17; --cook:#8fb3e6; --cook-bg:#1a2433;
  --band-edge:#5b665d; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
html,body{background:var(--bg);color:var(--ink)}
body{height:100%;font-family:var(--f-body);font-size:15px;line-height:1.4;padding-inline:12px;padding-block:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex:none;flex-wrap:nowrap;min-width:0}
.top h1{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(14px,4.4vw,18px);margin:0;letter-spacing:.04em;white-space:nowrap}
.pages{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.page-tab{white-space:nowrap;border:none;background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;min-height:34px;color:var(--muted)}
.page-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 20%,transparent)}
.clockbox{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.clock{font-family:var(--f-mono);font-weight:700;font-size:20px;line-height:1}
.shop{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.shop[data-s="open"]{background:var(--ok);color:var(--surface)}
.shop[data-s="prep"]{background:var(--warn);color:var(--surface)}
.alerts{display:flex;flex-direction:column;gap:6px;flex:none}
.alert{display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 6px 6px 10px;border:2px solid var(--warn);background:var(--warn-bg);font-size:13px}
.alert.urgent{border-color:var(--bad);background:var(--bad-bg);animation:pulse 1.6s ease-in-out infinite}
.alert p{margin:0;flex:1;min-width:0}
.alert b{font-weight:900}
.alert .btn{min-height:36px;padding:4px 10px;font-size:13px}

/* boards */
main{flex:1;min-height:0;display:grid}
.board{min-height:0;display:grid;grid-template-rows:minmax(0,30fr) minmax(0,70fr);gap:8px}
@media (min-width:900px) and (min-aspect-ratio:4/3){.board{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(0,2fr)}}
.pearls{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
@media (min-width:900px) and (min-aspect-ratio:4/3){.pearls{grid-template-columns:none;grid-template-rows:1fr 1fr}}
.teas,.tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;min-height:0}
@media (min-width:560px){.teas,.tops{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tops{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))}

.tops .cbody{gap:4px}
.tops .sug{font-size:14px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-size:34px;min-width:2ch;text-align:center}
.stepper .btn{min-width:60px;font-size:26px;line-height:1}
.stepper .btn[data-fr="0"]{font-size:15px;min-width:0}
.stepper input{width:4.2ch;font-size:32px;font-weight:700;text-align:center;padding:4px 2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.stepper.sm b{font-size:24px}
.stepper.sm .btn{min-width:48px;font-size:20px}
.stepper.sm span:first-child{font-weight:700}

.card{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.card:active{transform:scale(.98)}
.band{background:var(--bucket);color:var(--bandfg,#fff);padding:3px 8px;display:flex;align-items:baseline;gap:6px;box-shadow:inset 0 -1px 0 var(--band-edge);flex:none;min-width:0}
.band b{font-weight:900;font-size:15px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band small{margin-left:auto;font-size:11px;opacity:.9;white-space:nowrap}
.cbody{flex:1;min-height:0;overflow:hidden;padding:3px 8px 2px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.left{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(16px,4.4vw,26px);line-height:1.05}
.cap{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally{flex:none;font-size:11px;color:var(--muted);padding:0 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally b{color:var(--ink);font-family:var(--f-mono)}
.tally b.bad{color:var(--bad)}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;flex:none;margin:0 8px 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.idle{color:var(--muted);font-size:13px}
.alertline{font-size:12px;font-weight:700;color:var(--warn);line-height:1.3}
.alertline.urgent{color:var(--bad)}
.more{position:absolute;right:6px;top:28px;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 6px}
.card[data-phase="cook"]{background:var(--cook-bg);border-color:var(--cook)} .card[data-phase="cook"] .left{color:var(--cook)} .card[data-phase="cook"] .bar i{background:var(--cook)}
.card[data-phase="warn"]{background:var(--warn-bg);border-color:var(--warn)} .card[data-phase="warn"] .left{color:var(--warn)} .card[data-phase="warn"] .bar i{background:var(--warn)}
.card[data-phase="dead"]{background:var(--bad-bg);border-color:var(--bad);animation:pulse 1.6s ease-in-out infinite} .card[data-phase="dead"] .left{color:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 40%,transparent)}}
.card.pearl .cbody{flex-direction:row;align-items:center;justify-content:space-between;gap:6px}
.card.pearl .cbody>div{min-width:0}
.card.pearl .left{font-size:clamp(18px,5vw,30px)}
.sug{font-size:11px;color:var(--pearl);font-weight:700}
.card.stopped{opacity:.55}
.card.stopped .idle{font-weight:700}
.card.addtop{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:700;background:transparent}
.tops .card .left{font-family:var(--f-body);font-size:clamp(20px,5vw,30px);font-weight:900}

/* pot animation */
.potsvg{height:100%;max-height:88px;width:auto;aspect-ratio:120/96;max-width:46%;flex:none;overflow:visible}
.potsvg .body{fill:var(--sunk);stroke:var(--ink);stroke-width:2.5}
.potsvg .rim{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.potsvg .water{fill:color-mix(in srgb,var(--liq) 45%,var(--cook-bg))}
.potsvg .pearlball{fill:var(--liq);stroke:color-mix(in srgb,var(--ink) 40%,transparent);stroke-width:.8}
.potsvg .hi{fill:#fff;opacity:.45}
.potsvg .bub{fill:none;stroke:var(--surface);stroke-width:1.4}
.potsvg .steam{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round;opacity:0}
.potsvg .flame{fill:#e8762b} .potsvg .flame.in{fill:#f6c548}
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.bob.b2{animation-duration:.9s;animation-delay:-.3s}.bob.b3{animation-duration:1.3s;animation-delay:-.6s}.bob.b4{animation-duration:1s;animation-delay:-.2s}.bob.b5{animation-duration:1.2s;animation-delay:-.8s}
@keyframes bob{from{transform:translate(0,2px) rotate(-8deg)}to{transform:translate(2px,-4px) rotate(10deg)}}
.bub{animation:rise 1.6s ease-in infinite;transform-box:fill-box}
.bub.u2{animation-delay:-.5s}.bub.u3{animation-delay:-1.1s}
@keyframes rise{0%{transform:translateY(6px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-10px) scale(1.2);opacity:0}}
.steam{animation:steam 2.6s ease-out infinite}
.steam.s2{animation-delay:-.9s}.steam.s3{animation-delay:-1.7s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}25%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
.flame{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.flame.f2{animation-delay:-.15s}.flame.f3{animation-delay:-.25s}
@keyframes flick{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
@media (prefers-reduced-motion:reduce){.bob,.bub,.steam,.flame,.card[data-phase="dead"],.alert.urgent{animation:none}.steam{opacity:.5}}

/* bottom strip */
.strip{flex:none;display:flex;align-items:center;gap:4px 10px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);padding-top:6px;font-size:13px;color:var(--muted)}
.strip b{color:var(--ink);font-family:var(--f-mono)}
.strip b.bad{color:var(--bad)}
.strip .btn{margin-left:auto;min-height:40px;flex:none}
.strip>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.strip .tab{flex:none}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500}
.btn.wide{min-height:64px;font-size:20px;width:100%}
.btn.wide small{display:block;font-weight:500;font-size:13px}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);border-radius:14px;padding:16px;width:min(680px,100%);max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h3{margin:0;font-size:22px;font-weight:900}
.sheet-head .swatch{width:16px;height:22px;border-radius:3px;background:var(--bucket);box-shadow:0 0 0 1px var(--band-edge)}
.sheet-head .btn{margin-left:auto}
.lbl{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0}
.rows{display:flex;flex-direction:column;gap:8px}
.row{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.row[data-phase="cook"]{background:var(--cook-bg);border-color:var(--cook)}
.row[data-phase="warn"]{background:var(--warn-bg);border-color:var(--warn)}
.row[data-phase="dead"]{background:var(--bad-bg);border-color:var(--bad)}
.row-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.row-top .left{font-size:22px}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:6px}
.part b{font-size:20px}
.part .acts{margin-left:auto}
.loc[data-loc="fridge"]{background:var(--cook);color:var(--surface)}
.confirm{display:flex;flex-direction:column;gap:8px;border:2px solid var(--bad);background:var(--bad-bg);border-radius:10px;padding:10px 12px;width:100%}
.confirm b{color:var(--bad)}
.staff .tab[aria-pressed="true"]{background:var(--top);border-color:var(--top);color:var(--surface)}
.merge{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:13px;color:var(--muted)}
.loc{font-size:13px;font-weight:900;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);align-self:center}
.loc[data-loc="standby"]{background:var(--sunk);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.more{white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts span{font-size:13px;color:var(--muted);width:100%}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;font-family:var(--f-mono);font-weight:700;font-size:22px;min-height:60px}
.size.custom{display:flex;flex-direction:column;gap:4px;padding:6px;font-family:var(--f-body)}
.size.custom input{width:100%;min-width:0;font:inherit;font-family:var(--f-mono);font-size:20px;text-align:center;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.size.custom .btn{min-height:32px;padding:2px;font-size:13px}
.size small.unit{display:inline;font-size:14px;margin-left:2px}
.size small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.size.sug2{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px;font-weight:700;min-height:48px}
.mode small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--pearl);color:var(--surface);border-color:var(--pearl)}
.mode[aria-pressed="true"] small{color:inherit;opacity:.85}
.note{font-size:13px;color:var(--muted);margin:0}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}

/* records */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.tab[data-wd]{padding:6px 9px;min-width:0}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;min-height:36px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav strong{font-size:18px;min-width:9em;text-align:center}
.grp-chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.bigchk{width:22px;height:22px;accent-color:var(--bad)}
.big-toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:14px}
.big-toggle input{width:22px;height:22px;accent-color:var(--bad)}
.big-toggle.on{border-color:var(--bad);background:var(--bad-bg)}
.kpis{display:flex;flex-wrap:wrap;gap:18px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:20px}
.kpi.bad b{color:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:480px}
table.avg{min-width:0}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
tr.grp td{position:sticky;left:0}
.btn.xs{min-height:32px;padding:2px 8px;font-size:12px}
.band b.long{font-size:13px;letter-spacing:0}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700}
tr.grp td{background:var(--sunk);font-weight:900;font-size:13px}
td.r-bad{color:var(--bad);font-weight:700}
td small{color:var(--muted);font-size:11px}
.dot{display:inline-block;width:10px;height:12px;border-radius:2px;background:var(--bucket);margin-right:8px;vertical-align:middle;box-shadow:0 0 0 1px var(--band-edge)}
.demo-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:10px}
.status{font-size:12px;color:var(--muted);margin:0}
.expire-bg{position:fixed;inset:0;z-index:15;background:color-mix(in srgb,var(--bad) 30%,color-mix(in srgb,var(--ink) 55%,transparent));display:flex;align-items:center;justify-content:center;padding:16px}
.expire{background:var(--surface);border:3px solid var(--bad);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.expire h2{margin:0;font-size:26px;font-weight:900;color:var(--bad);display:flex;align-items:center;gap:10px}
.expire h2 .num{font-size:15px;color:var(--muted);font-weight:500;margin-left:auto}
.xrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bad-bg);flex-wrap:wrap}
.xrow .sw{width:12px;align-self:stretch;border-radius:3px;background:var(--bucket);box-shadow:0 0 0 1px var(--band-edge)}
.xrow div{flex:1;min-width:8em}
.xrow b{font-size:20px;font-weight:900;display:block}
.xrow small{color:var(--muted);font-size:13px}
.xacts{display:flex;gap:8px;flex-wrap:wrap}
.xacts .btn{flex:1}
.clockrow{display:flex;align-items:center;gap:6px}
.cloud{width:9px;height:9px;border-radius:50%;background:var(--muted);display:none}
.cloud[data-s="ok"]{display:block;background:var(--ok)}.cloud[data-s="wait"]{display:block;background:var(--warn)}.cloud[data-s="bad"]{display:block;background:var(--bad)}
.gate-bg{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate{width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.gate h2{font-family:var(--f-display);font-size:28px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
/* landscape (phone or tablet on its side): pearls stacked on the left, teas in 2 rows of 6, toppings in one row of 4 */
@media (orientation:landscape) and (min-aspect-ratio:4/3){
  .board{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(0,3fr)}
  .pearls{grid-template-columns:none;grid-template-rows:1fr 1fr}
  .teas{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tops{grid-template-columns:repeat(4,minmax(0,1fr))!important;grid-template-rows:1fr}
  /* sideways, the first row follows the counter left to right */
  .teas [data-open="紅茶"]{order:1}
  .teas [data-open="夏青"]{order:2}
  .teas [data-open="綠茶"]{order:3}
  .teas [data-open="春青"]{order:4}
  .teas [data-open="秋青"]{order:5}
  .teas [data-open="冬青"]{order:6}
  .teas [data-open="香鳶尾青茶"]{order:7}
  .teas [data-open="國寶茶"]{order:8}
  .teas [data-open="菊花茶"]{order:9}
  .teas [data-open="蕎麥茶"]{order:10}
  .teas [data-open="玄米茶"]{order:11}
  .teas [data-open="奶茶"]{order:12}
}
/* short screens (phone on its side): tighter chrome so the board gets the height */
@media (orientation:landscape) and (max-height:500px){
  body{gap:5px;padding-block:6px}
  h1{font-size:15px}
  .page-tab{min-height:30px;padding:3px 10px;font-size:13px}
  .clockbox{flex-direction:row;align-items:center;gap:8px}
  .clock{font-size:17px}
  .strip{padding-top:4px}
  .strip .btn{min-height:34px;padding:4px 12px}
  .band{padding:2px 8px}
  .band b{font-size:14px}
  .left,.card.pearl .left{font-size:clamp(14px,2.1vw,19px)}
  .teas .band small{display:none}
  .teas .cbody .idle{font-size:12px}
  .potsvg{max-height:56px;max-width:40%}
  .alert{padding:3px 4px 3px 8px}
  .alert .btn{min-height:30px}
}

<body>

<div class="top">
  <h1>後場效期板</h1>
  <div class="pages" role="tablist" aria-label="分頁">
    <button class="page-tab" role="tab" data-page="tea" aria-selected="true">茶湯・珍珠</button>
    <button class="page-tab" role="tab" data-page="top" aria-selected="false">配料</button>
  </div>
  <div class="clockbox"><div class="clockrow"><span class="cloud" id="cloud" data-s="off" aria-hidden="true"></span><div class="clock num" id="clock">--:--:--</div></div><div class="shop" id="shop" data-s="closed"></div></div>
</div>
<div class="alerts" id="alerts" aria-live="assertive"></div>
<main id="main"></main>
<div class="strip" id="strip"></div>

<div class="sheet-bg" id="sheet" hidden><div class="sheet" id="sheet-box" role="dialog" aria-modal="true"></div></div>
<div class="expire-bg" id="expire" hidden><div class="expire" role="alertdialog" aria-modal="true" aria-labelledby="xtitle" id="expire-box"></div></div>
<div class="gate-bg" id="gate" hidden><div class="gate" id="gate-box"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== items ===== */
const ITEMS=[
  {k:"冬青",b:"#6b4426"},{k:"秋青",b:"#2e7d3a"},{k:"春青",b:"#c0392b"},{k:"綠茶",b:"#1e1e1e"},
  {k:"夏青",b:"#2563a8"},{k:"紅茶",b:"#1e1e1e"},
  {k:"香鳶尾青茶",b:"#ece6d6",fg:"#3a3527",per:1.5,limited:true,takeout:true},
  {k:"國寶茶",b:"#7a7f78",pot:true,mults:{1:.8,2:1.5,3:2.3}},{k:"菊花茶",b:"#7a7f78",pot:true,mults:{1:.8,2:1.5,3:2.3}},{k:"蕎麥茶",b:"#7a7f78",pot:true,per:1.5},{k:"玄米茶",b:"#7a7f78",pot:true,per:1.5},{k:"奶茶",b:"#7a7f78",pot:true,per:1.5},
  {k:"琥珀珍珠",b:"#8a5424",pearl:true},{k:"蕎麥珍珠",b:"#6e5a45",pearl:true}
];
/* toppings: boxes per 份, and how many boxes to keep in the fridge on busy / quiet days */
const TOPS=[
  {n:"杏仁凍",box:1,busy:2,quiet:1,max:2},{n:"菜燕",box:1,busy:3,quiet:2,max:3},
  {n:"茶凍",box:1,busy:4,quiet:2,max:3},{n:"婚貴",box:2,busy:5,quiet:3,max:3}
];
const topBy=Object.fromEntries(TOPS.map(t=>[t.n,t]));
const PEARL_SIZES=[500,1000,1500,2000,2500,3000];
const TEA_MULTS=[1,2,3];
const M=6e4,H=60*M,D=24*H;
const TEA_LIFE=4*H, PEARL_COOK=1.5*H, PEARL_LIFE=3*H, PEARL_HEADSUP=15*M, TOP_DAYS=3, AVG_DAYS=28;
const byKey=Object.fromEntries(ITEMS.map(i=>[i.k,i]));
const isPearl=k=>!!byKey[k]?.pearl;
const per=k=>byKey[k]?.per||1;
const bucketsFor=(k,n)=>byKey[k]?.mults?.[n]??n*per(k);
const bk=b=>b.buckets??bucketsFor(b.item,b.size);
const fmt=n=>(Math.round(n*100)/100).toLocaleString("zh-TW");
const amt=(k,n)=>isPearl(k)?`${fmt(n)}g`:byKey[k]?.pot?`${n}倍・${bucketsFor(k,n)}桶`:`${bucketsFor(k,n)}桶`;
/* cooked and wasted amount of one record, in its own unit (桶 / g / 份) */
const cookedOf=b=>b.kind==="top"?(b.boxes||1):isPearl(b.item)?b.size:bk(b);
const wasteOf=b=>b.kind==="top"?(b.wasteBucket||0):isPearl(b.item)?(b.waste||0):(b.wasteBucket||0);
const $=id=>document.getElementById(id);

/* ===== state (saved in this device's browser) ===== */
let batches=[], tops=[], bigDays=new Set(); /* "YYYY-MM-DD|品項": that item had a big order that day */
const topItems=TOPS.map(t=>t.n);
const DEFAULT_STAFF=["力瑜","予諠","Jessie","Vicky","晨蕊","以馨","小唐","田祈","ㄍㄨㄅ","微媛","小潔","庭瑋"];
let lateOk=false, mergeAmt=0, delMode=null, staff=[...DEFAULT_STAFF], selStaff=[], staffEdit=false;
let page="tea", sheet=null, openWaste=null, confirmDel=null, pearlMode="cook";
let recView="day", recDay=null, recWd=new Date().getDay();
let fridgeLog={}; /* dayKey -> {配料: {count, exp}}: boxes counted in the fridge before making, and how many of them expire tonight */
let topExtra={};  /* dayKey -> {配料: extra boxes made for a big order} */
let busyOverride={}; /* dayKey -> true/false when staff flips today's busy setting */
try{const p=localStorage.getItem("board-page");if(p==="top")page="top"}catch(e){}
let seq=0; const newId=()=>Date.now().toString(36)+(seq++);
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}

const STORE_KEY="tea-board-v1";
/* ===== cloud sync: Firebase Firestore, shared by every device with the same 店號 =====
   Layout: shops/{店號}/batches/{id}, shops/{店號}/tops/{id}, shops/{店號}/meta/state. Last writer wins per document. */
const FIREBASE_CONFIG=window.FIREBASE_CONFIG||null;
const LOCAL_KEY="tea-board-device";
let shopCode=null;
function loadDevice(){try{const o=JSON.parse(localStorage.getItem(LOCAL_KEY)||"{}");shopCode=o.shopCode||null;selStaff=o.selStaff||[]}catch(e){}}
function saveDevice(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({shopCode,selStaff}))}catch(e){}}
const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const clean=o=>JSON.parse(JSON.stringify(o));
const metaOf=()=>({bigDays:[...bigDays],fridgeLog,topExtra,busyOverride,staff,stopped});
const cloud={on:false,ready:false,got:{},base:null,last:{batches:{},tops:{},meta:null},status:"",
  start(code){
    try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG)}catch(e){this.fail("設定錯誤");return}
    const db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    this.base=db.collection("shops").doc(code);this.on=true;this.set("連線中…");
    /* sign in anonymously; if the account is ever removed or signed out, quietly sign in again */
    const auth=firebase.auth();let listening=false;
    auth.onAuthStateChanged(u=>{if(u){if(!listening){listening=true;this.listen()}}else auth.signInAnonymously().catch(e=>this.fail("登入失敗（"+(e.code||e.message)+"）"))});
  },
  fail(t){this.set(t);toast(t)},
  set(t){this.status=t;const el=$("cloud");if(el){el.dataset.s=t==="已同步"?"ok":/中斷|失敗|錯誤/.test(t)?"bad":"wait";el.title=t}},
  done(k){this.got[k]=1;if(this.got.batches&&this.got.tops&&this.got.meta)this.ready=true;render()},
  listen(){
    const cut=Date.now()-70*D;
    [["batches",v=>batches=v],["tops",v=>tops=v]].forEach(([col,put])=>
      this.base.collection(col).where("startAt",">=",cut).onSnapshot(s=>{
        const arr=s.docs.map(d=>({...d.data(),id:d.id}));
        this.last[col]=Object.fromEntries(arr.map(x=>[x.id,stable(clean(x))]));put(arr);
        this.set(s.metadata.hasPendingWrites?"同步中…":s.metadata.fromCache?"離線中（恢復連線會自動上傳）":"已同步");this.done(col);
      },e=>this.fail("同步中斷（"+e.code+"）")));
    this.base.collection("meta").doc("state").onSnapshot(d=>{
      const o=d.exists?d.data():{};
      bigDays=new Set(o.bigDays||[]);fridgeLog=o.fridgeLog||{};topExtra=o.topExtra||{};busyOverride=o.busyOverride||{};
      staff=o.staff?.length?o.staff:[...DEFAULT_STAFF];stopped=o.stopped||{};selStaff=selStaff.filter(n=>staff.includes(n));
      this.last.meta=d.exists?stable(clean(metaOf())):null;this.done("meta");
    },e=>this.fail("同步中斷（"+e.code+"）"));
  },
  push(){
    if(!this.ready)return;
    const wb=this.base.firestore.batch();let n=0;
    [["batches",batches],["tops",tops]].forEach(([col,arr])=>{
      const prev=this.last[col],seen={};
      arr.forEach(x=>{const c=clean(x),k=stable(c);seen[x.id]=1;if(prev[x.id]!==k){wb.set(this.base.collection(col).doc(x.id),c);prev[x.id]=k;n++}});
      Object.keys(prev).forEach(id=>{if(!seen[id]){wb.delete(this.base.collection(col).doc(id));delete prev[id];n++}});
    });
    const m=clean(metaOf()),mk=stable(m);if(mk!==this.last.meta){wb.set(this.base.collection("meta").doc("state"),m);this.last.meta=mk;n++}
    if(n)wb.commit().catch(e=>this.fail("沒有存到（"+e.code+"），請檢查網路"));
  }
};
function showGate(){
  $("gate").hidden=false;
  $("gate-box").innerHTML=`<h2>後場效期板</h2><p class="note">請輸入店號。店號在店內群組，第一次輸入後這支手機會記住。</p>
    <form class="field" id="gateform"><input id="gatecode" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="店號" value=""><button class="btn pri" type="submit">進入</button></form>`;
  setTimeout(()=>$("gatecode")?.focus(),50);
}
function enterShop(code){code=code.trim().toLowerCase();if(!/^[a-z0-9-]{6,40}$/.test(code)){toast("店號格式不對");return false}
  shopCode=code;saveDevice();$("gate").hidden=true;cloud.start(code);return true}

function save(){if(cloud.on){saveDevice();cloud.push();return}try{localStorage.setItem(STORE_KEY,JSON.stringify({batches,tops,bigDays:[...bigDays],fridgeLog,topExtra,busyOverride,staff,selStaff,stopped}))}catch(e){}}
function load(){loadDevice();if(FIREBASE_CONFIG&&window.firebase){
  const m=location.hash.match(/^#([a-z0-9-]{6,40})$/i);if(m){shopCode=m[1].toLowerCase();saveDevice();history.replaceState(null,"",location.pathname+location.search)}
  shopCode?cloud.start(shopCode):showGate();return}
  if(FIREBASE_CONFIG)setTimeout(()=>toast("連不上同步伺服器，先存在這支手機，請檢查網路後重新整理"),800);
  try{const o=JSON.parse(localStorage.getItem(STORE_KEY)||"null");if(!o)return;const cut=Date.now()-70*864e5;
  batches=(o.batches||[]).filter(b=>b.startAt>=cut||b.status==="active");tops=(o.tops||[]).filter(t=>t.startAt>=cut||t.status==="active");
  bigDays=new Set(o.bigDays||[]);fridgeLog=o.fridgeLog||{};topExtra=o.topExtra||{};busyOverride=o.busyOverride||{};staff=o.staff?.length?o.staff:[...DEFAULT_STAFF];{const t=dayKey(Date.now());stopped=o.stopped?.[t]?{[t]:o.stopped[t]}:{}};selStaff=(o.selStaff||[]).filter(n=>staff.includes(n))}catch(e){}}

/* ===== time helpers ===== */
/* early staff start cooking at 8:00; shop is open 10:00–21:00 */
const PREP_H=8, OPEN_H=10, CLOSE_H=21;
/* tea lasts 4h, so the last brew of the day is 17:00 (good until closing at 21:00) */
const LAST_TEA_H=CLOSE_H-TEA_LIFE/H;
let stopped={}; /* dayKey -> [品項] staff marked as finished for the day */
const isStopped=(k,now)=>(stopped[dayKey(now)]||[]).includes(k);
const pastLastTea=now=>{const h=(now-startOfDay(now))/H;return h>=LAST_TEA_H&&h<CLOSE_H};
function shopState(now){const h=(now-startOfDay(now))/H;
  if(h>=OPEN_H&&h<CLOSE_H)return{s:"open",t:"營業中"};
  if(h>=PREP_H&&h<OPEN_H)return{s:"prep",t:"準備中"};
  return{s:"closed",t:"已打烊"};}
const pad=n=>String(n).padStart(2,"0");
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())};
const md=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()};
const WK="日一二三四五六";
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const dayDiff=(a,b)=>Math.round((startOfDay(a)-startOfDay(b))/D);
/* 三四五 is the busy stretch; 一二 and weekends are quieter */
const isBusyDefault=t=>{const w=new Date(t).getDay();return w>=3&&w<=5};
const isBusy=t=>busyOverride[dayKey(t)]??isBusyDefault(t);
const WD_ORDER=[1,2,3,4,5,6,0];
function fmtLeft(ms){const neg=ms<0;ms=Math.abs(ms);return (neg?"-":"")+Math.floor(ms/H)+":"+pad(Math.floor(ms%H/M))+":"+pad(Math.floor(ms%M/1e3))}
const readyAt=b=>b.readyAt||b.startAt;
function phase(b,now){if(isPearl(b.item)&&now<readyAt(b))return"cook";const l=b.expireAt-now;return l<=0?"dead":l<30*M?"warn":"ok"}
function timer(b,now){
  if(phase(b,now)==="cook")return{to:readyAt(b),from:b.startAt,cap:`${hm(readyAt(b))} 起鍋`};
  return{to:b.expireAt,from:readyAt(b),cap:b.expireAt<=now?"已過期，請報廢":`到 ${hm(b.expireAt)}`};
}
/* tea location: every tea batch is split into parts on the counter (檯面上), in the standby area (備茶區) or in the fridge (冰箱).
   Expiry stays 4h from cooking wherever a part sits. */
const isTea=k=>!byKey[k]?.pearl;
/* plain teas (春夏秋冬紅綠) sit on the counter with a standby bucket behind; pot teas and 香鳶尾 keep exactly one bucket on the counter and the rest in the fridge */
const isTakeout=k=>!!byKey[k]?.pot||!!byKey[k]?.takeout;
const isSingle=k=>!byKey[k]?.pearl&&!byKey[k]?.pot;
const isPlain=k=>isTea(k)&&!isTakeout(k);
const LOC={counter:"檯面上",standby:"備茶區",fridge:"冰箱"};
const LOCS={counter:"檯",standby:"備",fridge:"冰"};
function partsOf(b){if(!b.parts)b.parts=[{loc:b.loc==="standby"?"standby":"counter",amt:bk(b)}];return b.parts}
const remainOf=b=>isTea(b.item)?partsOf(b).reduce((a,p)=>a+p.amt,0):1;
const hasLoc=(b,l)=>partsOf(b).some(p=>p.loc===l);
const onCounter=b=>!isTea(b.item)||hasLoc(b,"counter");
function tidy(b){const m={};partsOf(b).forEach(p=>{if(p.amt>1e-9)m[p.loc]=(m[p.loc]||0)+p.amt});b.parts=["counter","standby","fridge"].filter(l=>m[l]).map(l=>({loc:l,amt:Math.round(m[l]*100)/100}))}
const live=k=>batches.filter(b=>b.item===k&&b.status==="active").sort((a,b)=>(onCounter(a)?0:1)-(onCounter(b)?0:1)||a.expireAt-b.expireAt);
const itemHasCounter=k=>isTea(k)&&batches.some(b=>b.item===k&&b.status==="active"&&hasLoc(b,"counter"));
/* when nothing is on the counter, the oldest standby bucket moves up (fridge stays put until someone takes it out) */
function promoteAll(){
  batches.forEach(b=>{if(b.status==="active"&&isTea(b.item)){tidy(b);if(!b.parts.length){b.status="done";b.endAt=b.endAt||Date.now()}}});
  /* plain teas never go in the fridge (records from older versions move to standby) */
  batches.forEach(b=>{if(b.status==="active"&&isPlain(b.item)&&hasLoc(b,"fridge")){b.parts.forEach(p=>{if(p.loc==="fridge")p.loc="standby"});tidy(b)}});
  /* pot teas and 香鳶尾: at most one bucket on the counter, everything else in the fridge (also fixes records saved by older versions) */
  ITEMS.forEach(i=>{if(!isTakeout(i.k))return;let used=false;
    live(i.k).forEach(b=>{partsOf(b).forEach(p=>{if(p.loc==="standby")p.loc="fridge";if(p.loc!=="counter")return;
      if(used){p.loc="fridge";return}used=true;if(p.amt>1){b.parts.push({loc:"fridge",amt:p.amt-1});p.amt=1}});tidy(b)})});
  ITEMS.forEach(i=>{if(!isPlain(i.k)||itemHasCounter(i.k))return;
    const L=batches.filter(b=>b.item===i.k&&b.status==="active"&&hasLoc(b,"standby")).sort((a,b)=>a.expireAt-b.expireAt);
    if(L.length){L[0].parts.find(p=>p.loc==="standby").loc="counter";tidy(L[0])}})}
const partsText=b=>partsOf(b).map(p=>`${LOC[p.loc]} ${fmt(p.amt)} 桶`).join("・");
function oldestFridge(k){const L=batches.filter(b=>b.item===k&&b.status==="active"&&hasLoc(b,"fridge")).sort((a,b)=>a.expireAt-b.expireAt);return L.length?{b:L[0]}:null}
function locSummary(k){const m={};live(k).forEach(b=>partsOf(b).forEach(p=>m[p.loc]=(m[p.loc]||0)+p.amt));
  return["counter","standby","fridge"].filter(l=>m[l]).map(l=>`${LOCS[l]}${fmt(m[l])}`).join("・")}
const pct=(t,now)=>Math.max(0,Math.min(100,(t.to-now)/(t.to-t.from)*100));
/* toppings: made on day D, good through the end of D+3 */
const TOP_REMIND_H=20;
const topDueAt=t=>startOfDay(t.expireAt)+TOP_REMIND_H*H;
function topPhase(t,now){return now>=topDueAt(t)?"dead":startOfDay(t.expireAt)<=startOfDay(now)?"warn":"ok"}
function topLeft(t,now){const ph=topPhase(t,now);return ph==="dead"?"需報廢":ph==="warn"?"今晚 8 點報廢":`剩 ${dayDiff(t.expireAt,now)} 天`}
const fmtBox=v=>String(Math.round(v*10)/10);
const batchLabel=t=>`${md(t.startAt)}-${md(t.expireAt)}`;
const liveTop=n=>tops.filter(t=>t.name===n&&t.status==="active").sort((a,b)=>a.expireAt-b.expireAt);

/* ===== today's running total per item ===== */
function todayTotals(list,match){
  const today=startOfDay(Date.now());let c=0,w=0;
  list.forEach(b=>{if(b.startAt>=today&&match(b)){c+=cookedOf(b);w+=wasteOf(b)}});return{c,w};
}
const tallyHTML=(c,w,u)=>`<div class="tally">累計 <b>${fmt(c)}</b>${u}・報廢 <b class="${w?"bad":""}">${fmt(w)}</b>${u}</div>`;

/* ===== pot drawing ===== */
function potSVG(id){
  const c="clip-"+String(id).replace(/[^\w-]/g,"");
  const balls=[[38,58,1],[52,62,2],[66,57,3],[80,61,4],[46,70,5],[60,72,1],[74,70,3],[86,68,2],[34,68,4],[58,52,5],[72,50,2],[44,50,3]];
  return `<svg class="potsvg" viewBox="0 0 120 96" aria-hidden="true">
    <path class="steam" d="M42 22c-4-5 4-8 0-14"/><path class="steam s2" d="M60 20c-4-5 4-8 0-14"/><path class="steam s3" d="M78 22c-4-5 4-8 0-14"/>
    <rect x="8" y="34" width="12" height="7" rx="3" class="rim"/><rect x="100" y="34" width="12" height="7" rx="3" class="rim"/>

function card(i,now){
  const L=live(i.k), b=L[0], p=i.pearl;
  const style=`--bucket:${i.b};--liq:${i.b}`+(i.fg?`;--bandfg:${i.fg}`:"");
  const tt=todayTotals(batches,x=>x.item===i.k);
  const tally=tallyHTML(tt.c,tt.w,p?"g":"桶");
  const al=p?pearlAlertMap[i.k]:null;
  const alertLine=al?`<div class="alertline ${al.urgent?"urgent":""}">${al.msg.replace(/<\/?b>/g,"").replace(i.k+" ","")}</div>`:"";
  if(!b){
    const s=p?suggest(i.k):null;
    const rule=p?"煮1.5h・效3h":i.limited?"限定":"效期4h";
    return `<button class="card ${p?"pearl":""} ${isStopped(i.k,now)?"stopped":""}" data-open="${i.k}" style="${style}" data-phase="${al?(al.urgent?"dead":"warn"):"none"}">
      <div class="band"><b class="${i.k.length>4?"long":""}">${i.k}</b><small>${rule}</small></div>
      <div class="cbody"><div>${al?alertLine:`<div class="idle">${isStopped(i.k,now)?"今天不煮了":"＋ 點一下"+(p?"下鍋":"登記")}</div>`}${s&&s.rec?`<div class="sug">建議 ${fmt(s.rec)}g</div>`:""}</div></div>${tally}</button>`;
  }
  const ph=phase(b,now), t=timer(b,now);
  return `<button class="card ${p?"pearl":""}" data-open="${i.k}" data-phase="${ph}" style="${style}">
    <div class="band"><b class="${i.k.length>4?"long":""}">${i.k}</b><small>${p?amt(i.k,b.size):locSummary(i.k)}</small></div>
    <div class="cbody"><div><div class="left" data-left="${b.id}">${fmtLeft(t.to-now)}</div><div class="cap">${!p&&!itemHasCounter(i.k)?"都在冰箱・":""}${t.cap}</div>${alertLine}</div>${p&&ph==="cook"?potSVG(b.id):""}</div>
    <div class="bar"><i data-bar="${b.id}" style="width:${pct(t,now)}%"></i></div>${tally}${p&&L.length>1?`<span class="more">+${L.length-1}</span>`:""}</button>`;
}

/* ===== toppings board ===== */
const boxesOnHand=n=>liveTop(n).reduce((a,t)=>a+(t.boxes||1),0);
const expBoxes=(n,now)=>liveTop(n).filter(t=>startOfDay(t.expireAt)<=startOfDay(now)).reduce((a,t)=>a+(t.boxes||1),0);
const madeOn=(n,ds)=>tops.filter(t=>t.name===n&&t.startAt>=ds&&t.startAt<ds+D).reduce((a,t)=>a+(t.boxes||1),0);
const wastedOn=(n,ds)=>tops.filter(t=>t.name===n&&t.status==="waste"&&t.endAt>=ds&&t.endAt<ds+D).reduce((a,t)=>a+(t.wasteBucket||0),0);
const logOf=(ds,n)=>fridgeLog[dayKey(ds)]?.[n];
/* boxes used on day ds: usable stock after the previous evening's count (minus what expired) + what was made then − this evening's count */
function usageOn(n,ds){const prev=logOf(ds-D,n),cur=logOf(ds,n);if(!prev||!cur)return null;return Math.max(0,prev.count-prev.exp+madeOn(n,ds-D)-cur.count)}
/* a day is skewed if a big order was made the evening before, or the day is marked big */
const topBig=(ds,n)=>!!topExtra[dayKey(ds-D)]?.[n]||bigDays.has(bigKey(ds,n));
function topSuggest(n,now){
  const T=topBy[n],today=startOfDay(now),tom=today+D,busy=isBusy(tom),lg=logOf(today,n);
  const have=lg?lg.count:boxesOnHand(n),exp=expBoxes(n,now),usable=Math.max(0,have-exp);
  const lw=tom-7*D,u=topBig(lw,n)?null:usageOn(n,lw);
  let base,src;
  if(u!=null){base=u;src=`上週${WK[new Date(lw).getDay()]}（${md(lw)}）用了 ${fmtBox(u)} 盒`}
  else{base=busy?T.busy:T.quiet;src=`還沒有上週${WK[new Date(tom).getDay()]}的紀錄，先用${busy?"忙":"不忙"}的預設 ${base} 盒`}
  const extra=topExtra[dayKey(today)]?.[n]||0,target=base+extra,need=Math.max(0,target-usable);
  /* the target is a ceiling: round down so the fridge never goes over it (婚貴 2.5 盒 → 1 份 = 4.5 盒, not 2 份 = 6.5 盒) */
  const want=Math.floor(need/T.box+1e-9);
  return{T,have,exp,usable,base,src,extra,target,need,want,portions:Math.min(want,T.max),counted:!!lg,tom};
}
function topCard(n,now){
  const L=liveTop(n),tt=todayTotals(tops,x=>x.name===n),s=topSuggest(n,now);
  const ph=!L.length?"none":L.some(t=>topPhase(t,now)==="dead")?"dead":s.exp?"warn":"ok";
  return `<button class="card" data-topen="${n}" data-phase="${ph}" style="--bucket:var(--top)">
    <div class="band"><b>${n}</b><small>1份=${s.T.box}盒</small></div>
    <div class="cbody"><div class="left">${s.have?`冰箱 ${fmtBox(s.have)} 盒`:"冰箱沒有"}</div>
      <div class="cap">${s.exp?`今晚報廢 ${s.exp} 盒・`:""}明天最多 ${fmtBox(s.target)} 盒${s.counted?"":"・未點數"}</div>
      <div class="sug" style="color:var(--top)">${s.portions?`建議做 ${s.portions} 份（${s.portions*s.T.box} 盒）`:"夠了，不用做"}</div></div>${tallyHTML(tt.c,tt.w,"盒")}</button>`;
}
function renderTopBoard(){
  const now=Date.now(),busy=isBusy(now+D);

/* ===== waste chips ===== */
function wasteChips(id,p,max,size){
  let opts;
  if(p)opts=[1,.75,.5,.25];
  else{opts=[.25,.5,.75];for(let v=1;v<=max+1e-9;v+=.5)opts.push(v);opts=opts.filter(v=>v<=max).reverse()}
  return opts.map(f=>`<button class="btn bad" data-waste="${id}" data-f="${f}">${f} ${p?"鍋":"桶"}${p?`<br><small class="num">${fmt(Math.round(size*f))}g</small>`:""}</button>`).join("");
}

const topExpire=t=>startOfDay(t)+(TOP_DAYS+1)*D-1;

/* ===== records ===== */
const bigKey=(ds,name)=>dayKey(ds)+"|"+name;
const isBigFor=(ds,name)=>bigDays.has(bigKey(ds,name))||batches.some(b=>b.big&&b.item===name&&b.startAt>=ds&&b.startAt<ds+D);
function dayRecords(ds){
  const de=ds+D;
  const rows=ITEMS.map(i=>{const bs=batches.filter(b=>b.item===i.k&&b.startAt>=ds&&b.startAt<de);
    return{name:i.k,color:i.b,grp:i.pearl?"珍珠":"茶湯",u:i.pearl?"g":"桶",n:bs.length,c:bs.reduce((a,b)=>a+cookedOf(b),0),w:bs.reduce((a,b)=>a+wasteOf(b),0)}});
  rows.forEach(r=>r.used=r.c-r.w);
  topItems.forEach(n=>{const bs=tops.filter(t=>t.name===n&&t.startAt>=ds&&t.startAt<de),w=wastedOn(n,ds),u=usageOn(n,ds),lg=logOf(ds,n);
    const by=[...new Set(bs.flatMap(t=>t.by||[]))];
    rows.push({name:n,by,color:"var(--top)",grp:"配料",u:"盒",n:bs.length,c:madeOn(n,ds),w,used:u,count:lg?.count})});

}
function avgTable(){

    all.push(ds); if(new Date(ds).getDay()===recWd)sel.push(ds)}

    ...topItems.map(n=>({name:n,color:"var(--top)",grp:"配料",u:"盒",match:t=>t.name===n,list:tops}))];

/* ===== pearl suggestion & reminders ===== */
function suggest(item){
  const now=Date.now(), wd=new Date(now).getDay(), tod=now+PEARL_COOK-startOfDay(now); let days=0,sum=0,skipped=0;
  for(let i=1;i<=AVG_DAYS;i++){const ds=startOfDay(now-i*D);if(new Date(ds).getDay()!==wd)continue;
    const dayB=batches.filter(b=>b.item===item&&b.startAt>=ds&&b.startAt<ds+D&&b.status!=="active");
    if(!dayB.length)continue;if(isBigFor(ds,item)){skipped++;continue}
    days++;const from=ds+tod,to=from+PEARL_LIFE;dayB.forEach(b=>{const r=readyAt(b);if(r>=from&&r<to)sum+=b.size-(b.waste||0)})}
  if(!days)return null;const avg=sum/days;
  return{avg,days,skipped,group:"週"+WK[wd],rec:avg<=0?0:(PEARL_SIZES.find(z=>z>=avg)||PEARL_SIZES[PEARL_SIZES.length-1])};
}
let offToday=[];
function pearlAlerts(now){
  const today=startOfDay(now),out=[],open=today+OPEN_H*H,close=today+CLOSE_H*H;
  if(now<today+PREP_H*H||now>=close)return out;
  ITEMS.filter(i=>i.pearl).forEach(i=>{
    if(offToday.includes(i.k+dayKey(now))||isStopped(i.k,now))return;
    const L=batches.filter(b=>b.item===i.k&&b.status==="active");
    /* stock must last from opening until closing */
    const cover=L.length?Math.max(...L.map(b=>b.expireAt)):now;
    if(cover>=close)return;
    const until=Math.max(cover,now<open?open:cover)-PEARL_COOK-now;if(until>PEARL_HEADSUP)return;
    const urgent=until<=0;
    const msg=!L.length?(now<open?`<b>${i.k}</b> 開店前要煮好，現在下鍋 ${hm(now+PEARL_COOK)} 起鍋`:`<b>${i.k}</b> 沒有了，現在下鍋 ${hm(now+PEARL_COOK)} 才有`)
      :urgent?`<b>${i.k}</b> ${hm(cover)} 到期，已晚 ${Math.round(-until/M)} 分鐘，快下鍋`
      :`<b>${i.k}</b> ${hm(cover)} 到期，${hm(cover-PEARL_COOK)} 前要下鍋`;
    out.push({k:i.k,msg,urgent});
  });return out;
}
let lastAlertKey="",alerting=new Set();
function renderAlerts(now,force){

  const fresh=a.filter(x=>!alerting.has(sig(x)));alerting=new Set(a.map(sig));
  if(fresh.length)beep(fresh.some(x=>x.urgent)?3:2);
  if(key===lastAlertKey&&!force)return;const changed=key!==lastAlertKey;lastAlertKey=key;
  pearlAlertMap=Object.fromEntries(a.map(x=>[x.k,x]));
  if(changed&&!force&&page==="tea")renderBoard();
}

    else if("pout" in d){if(itemHasCounter(b.item)){toast("檯面還有，用完再拿");return}const take=Math.min(1,p.amt);p.amt-=take;parts.push({loc:"counter",amt:take});toast(`${b.item} 從冰箱拿出 ${fmt(take)} 桶`)}
    return render()}
  if(d.wopen){openWaste=d.wopen;confirmDel=null;return renderSheet()}
  if(d.waste){const b=batches.find(x=>x.id===d.waste),f=+d.f,p=isPearl(b.item);openWaste=null;
    patch(batches,d.waste,{status:"waste",waste:p?Math.round(b.size*f):f,wasteBucket:f,endAt:Date.now()});toast(`已記報廢 ${f} ${p?`鍋（${fmt(Math.round(b.size*f))}g）`:"桶"}`);return render()}
  if(d.delask){confirmDel=d.delask;openWaste=null;return renderSheet()}
  if(d.del){confirmDel=null;batches=batches.filter(b=>b.id!==d.del);toast("已刪除");return render()}
  if("cancel" in d){openWaste=confirmDel=null;return renderSheet()}
  if(d.off){const k=dayKey(Date.now());(stopped[k]??=[]).includes(d.off)||stopped[k].push(d.off);offToday.push(d.off+k);renderAlerts(Date.now(),true);return toast(`今天不再提醒${d.off}`)}
  /* expired notice */
  if(d.xwaste){wasteAll(d.xwaste,!!d.xtop);toast("已記報廢");return render()}
  if("xall" in d){const now=Date.now();expiredList(now).filter(x=>!(snooze[x.id]>now)).forEach(x=>wasteAll(x.id,!!x.top));toast("全部已記報廢");return render()}
  if("xsnooze" in d){const until=Date.now()+10*M;expiredList(Date.now()).forEach(x=>snooze[x.id]=until);$("expire").hidden=true;shownExpire="";return}
  /* toppings */
  if("busy" in d){const t=Date.now()+D,k=dayKey(t);busyOverride[k]=!isBusy(t);return render()}
  if(d.fr!==undefined&&sheet?.startsWith("top:")){const n=sheet.slice(4),now=Date.now(),k=dayKey(now),s0=topSuggest(n,now);
    setFridge(n,s0.have+(+d.fr));return render()}
  if(d.fx!==undefined&&sheet?.startsWith("top:")){const n=sheet.slice(4),k=dayKey(Date.now());const v=Math.max(0,(topExtra[k]?.[n]||0)+(+d.fx));
    (topExtra[k]??={})[n]=v;if(!v)delete topExtra[k][n];return render()}
  if(d.tadd)return addTop(d.tadd,+d.q||1);
  if(d.tdone){openWaste=confirmDel=null;const t=tops.find(x=>x.id===d.tdone);patch(tops,d.tdone,{status:"done",wasteBucket:0,endAt:Date.now()});toast("已標記用完");return render()}
  if(d.twaste){openWaste=null;const t=tops.find(x=>x.id===d.twaste);patch(tops,d.twaste,{status:"waste",wasteBucket:+d.f,endAt:Date.now()});toast(`已記報廢 ${d.f} 盒`);return render()}
  if(d.tdel){confirmDel=null;const t=tops.find(x=>x.id===d.tdel);tops=tops.filter(x=>x.id!==d.tdel);toast("已刪除");return render()}
  /* records */
  if(d.rv){recView=d.rv;delMode=null;return renderSheet()}
  if(d.wd){recWd=+d.wd;return renderSheet()}
  if(d.dshift){delMode=null;const cur=recDay??startOfDay(Date.now());recDay=Math.min(startOfDay(Date.now()),startOfDay(cur+(+d.dshift)*D+2*H));return renderSheet()}
});
document.addEventListener("change",e=>{
  if(e.target.dataset?.bigitem){const k=bigKey(recDay??startOfDay(Date.now()),e.target.dataset.bigitem);e.target.checked?bigDays.add(k):bigDays.delete(k);renderSheet();renderBoard()}
});
document.addEventListener("change",e=>{
  if(e.target.id!=="frin"||!sheet?.startsWith("top:"))return;
  const v=parseFloat(e.target.value);if(!(v>=0)){toast("請輸入盒數，可以有小數點");return renderSheet()}
  setFridge(sheet.slice(4),v);render();
});
document.addEventListener("submit",e=>{
  if(e.target.id==="gateform"){e.preventDefault();enterShop($("gatecode").value);return}
  if(e.target.id==="staffform"){e.preventDefault();const n=$("staffname").value.trim();if(!n)return;
    if(!staff.includes(n))staff.push(n);if(!selStaff.includes(n))selStaff=[...selStaff,n];save();renderSheet();setTimeout(()=>$("staffname")?.focus(),30);return}
  if(e.target.id!=="tqform"||!sheet?.startsWith("top:"))return;e.preventDefault();
  const q=Math.floor(+$("tq").value);if(!(q>=1)){toast("請輸入份數");return}
  addTop(sheet.slice(4),q);
});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet()});
async function wake(){try{await navigator.wakeLock?.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});wake();
load();setInterval(tick,1000);tick();render();
setInterval(()=>{renderBoard();if(sheet==="records")renderSheet()},60e3);
</script>
